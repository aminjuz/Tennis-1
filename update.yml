name: Update tennis data
on:
  schedule:
    - cron: "0 4 * * *"      # every day 04:00 UTC; add more lines for tournament weeks
  workflow_dispatch:         # lets you start it by hand from the GitHub app
    inputs:
      top:
        description: "How many ranked players to refresh (1-200)"
        default: "100"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - run: python scraper/scrape.py --top ${{ github.event.inputs.top || '100' }}
      - name: Commit data
        run: |
          git config user.name "data-bot" && git config user.email "bot@users.noreply.github.com"
          git add data && (git diff --cached --quiet || git commit -m "Update data $(date -u +%F)") && git push
